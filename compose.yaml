services:
  mysql:
    image: mysql:8.0
    container_name: rc_drive_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rc_drive
      MYSQL_USER: rc_user
      MYSQL_PASSWORD: rc_password
    ports:
      - "3307:3306"
    volumes:
      - rc_drive_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rc_drive_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"

volumes:
  rc_drive_mysql_data: